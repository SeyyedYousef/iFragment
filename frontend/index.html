<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"/>
    <meta name="theme-color" content="#000000"/>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://*.telegram-user-content.org https://*.telegram.org https://*.t.me https://fragment.com https://*.tonconnect.org https://api.ifragment.app https://*.onrender.com http://localhost:8080; script-src 'self' 'unsafe-inline' https://telegram.org https://*.telegram.org; connect-src 'self' https://api.ifragment.app https://*.onrender.com https://*.tonapi.io https://bridge.tonapi.io wss://*.tonconnect.org; frame-src 'self' https://fragment.com https://*.tonconnect.org;">
    <meta name="description" content="iFragment — Professional Telegram username analytics and marketplace intelligence platform for the TON ecosystem."/>
    <meta name="robots" content="index, follow"/>
    <meta property="og:title" content="iFragment — Premium Analytics"/>
    <meta property="og:description" content="Master the Fragment market with surgical precision analytics, rarity scoring, and holder insights."/>
    <meta property="og:image" content="https://ifragment.app/og-image.png"/>
    <meta property="og:type" content="website"/>
    <title>iFragment — Premium Fragment Analytics</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="manifest" href="/manifest.webmanifest"/>
    
    <!-- Load fonts directly in head to prevent FOUC (Flash of Unstyled Content) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=Vazirmatn:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Force Telegram WebApp header color as early as possible
      if (window.Telegram && window.Telegram.WebApp) {
        try {
          window.Telegram.WebApp.setHeaderColor('#000000');
          window.Telegram.WebApp.setBackgroundColor('#000000');
        } catch(e) {}
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
