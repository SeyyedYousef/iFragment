services:
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-ifragment}?sslmode=disable
      - DRAGONFLY_URL=redis://dragonfly:6379/0
      - TG_SESSION_DIR=/app/sessions
    ports:
      - "8080:8080"
    volumes:
      - sessions_data:/app/sessions
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=1GB
      -c random_page_cost=1.1
      -c effective_io_concurrency=100
      -c wal_buffers=8MB
      -c checkpoint_completion_target=0.9
      -c checkpoint_timeout=10min
      -c max_connections=100
      -c max_worker_processes=2
      -c max_parallel_workers=2
      -c max_parallel_workers_per_gather=1
      -c idle_in_transaction_session_timeout=10000
      -c statement_timeout=30000
      -c lock_timeout=5000
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pass}
      - POSTGRES_DB=${POSTGRES_DB:-ifragment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-ifragment}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly:latest'
    command: [
      "dragonfly",
      "--cache_mode=true",
      "--maxmemory=${DRAGONFLY_MAX_MEMORY:-256MB}",
      "--keys_output_limit=4096",
      "--proactor_threads=1",
      "--dbfilename=dump",
      "--dir=/data"
    ]
    volumes:
      - dragonfly_data:/data
    ulimits:
      memlock: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  sessions_data:
  dragonfly_data:
  uploads_data:


