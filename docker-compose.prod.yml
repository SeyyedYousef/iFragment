services:
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-ifragment}?sslmode=disable
      - DRAGONFLY_URL=redis://dragonfly:6379/0
      - TG_SESSION_DIR=/app/sessions
    ports:
      - "8080:8080"
    volumes:
      - sessions_data:/app/sessions
    depends_on:
      db:
        condition: service_healthy
      dragonfly:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pass}
      - POSTGRES_DB=${POSTGRES_DB:-ifragment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-ifragment}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dragonfly:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    command: ["dragonfly", "--cache_mode=true", "--maxmemory=${DRAGONFLY_MAX_MEMORY:-512MB}"]
    ulimits:
      memlock: -1
    restart: unless-stopped

volumes:
  pgdata:
  sessions_data:
