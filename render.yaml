services:
  - type: web
    name: ifragment-api
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ifragment-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET_TOKEN
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TONAPI_KEY
        sync: false
      - key: MARKETAPP_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ifragment.onrender.com
      - key: APP_URL
        value: https://ifragment-api.onrender.com

  - type: web
    name: ifragment-webapp
    env: static
    rootDirectory: frontend
    buildCommand: npm install -g pnpm && pnpm install && pnpm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ifragment-api.onrender.com/api/v1

databases:
  - name: ifragment-db
    databaseName: ifragment
    user: user
    plan: free
